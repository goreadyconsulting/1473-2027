<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Crossing">
  <meta name="description" content="An immersive time crossing">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" as="image" type="image/webp" href="./assets/cinematics/portal-gate.webp">
  <link rel="stylesheet" href="./player.css">
  <link rel="stylesheet" href="./cinematic.css">
  <link rel="stylesheet" href="./grounded-world.css">
  <script src="./player.js" defer></script>
  <script type="module" src="./world3d.js"></script>
  <title>The Crossing</title>
</head>
<body>
<main id="world" aria-label="The Crossing">
  <section id="portalStage" class="stage active vortex-stage" aria-label="Enter the time portal" tabindex="0">
    <canvas id="portalCanvas" aria-hidden="true"></canvas>
    <div class="vortex-vignette" aria-hidden="true"></div>
    <div class="vortex-glow" aria-hidden="true"></div>
  </section>

  <section id="walkStage" class="stage walk-stage" aria-label="The walkway between worlds" tabindex="0">
    <div id="walkCamera" class="walk-camera">
      <div class="void-sky"></div>
      <div class="void-particles"></div>
      <div id="walkMonolith" class="walk-monolith" aria-hidden="true">
        <div class="monolith-glyph">ᛟ</div>
      </div>
      <div id="walkPath" class="walk-path" aria-hidden="true">
        <div class="walk-centerline"></div>
        <div class="walk-cracks"></div>
      </div>
      <div class="walk-side left"></div><div class="walk-side right"></div>
      <div class="walk-haze"></div>
    </div>
  </section>

  <section id="slabStage" class="stage slab-stage" aria-label="Seven-way stone portal">
    <div class="slab-ambience"></div>
    <div class="slab-floor"></div>
    <div class="slab-pillar left"></div><div class="slab-pillar right"></div>
    <div class="carved-slab">
      <div class="slab-grooves"></div>
      <div class="slab-inscription" aria-hidden="true">ᚺ ᛟ ᛚ ᚹ ᚱ ᛉ ᚠ</div>
      <div class="dial-rings"></div>
      <div class="rune-core" aria-hidden="true">ᛟ</div>
      <div id="runeWheel" class="rune-wheel" aria-label="Seven destinations"></div>
    </div>
  </section>

  <section id="reelStage" class="stage reel-stage" aria-label="Entering a destination">
    <div class="reel-screen">
      <img id="reelImage" alt="" draggable="false">
      <div class="reel-grain"></div>
      <div class="reel-flare"></div>
      <div class="reel-edge"></div>
      <div class="reel-vignette"></div>
    </div>
  </section>

  <section id="placeStage" class="stage place-stage" aria-label="Relic chamber">
    <div id="placeBackground" class="place-background"></div>
    <div class="place-wisps"></div>
    <div id="relicGallery" class="relic-gallery"></div>
    <button type="button" id="backToStone" class="back-stone" aria-label="Return to the ancient stone">ᛟ</button>
  </section>

  <section id="relicStage" class="stage relic-stage" aria-label="Relic examination">
    <div class="focus-halo"></div>
    <img id="relicHero" src="" alt="" draggable="false">
    <div class="focus-runes" aria-hidden="true">ᚺ ᚢ ᚱ ᛟ ᚹ ᛉ</div>
  </section>

  <div id="lossOverlay" class="loss-overlay" hidden aria-hidden="true">
    <div class="loss-ring"></div>
    <img id="lossRelic" alt="" draggable="false">
    <div class="loss-burst"></div>
  </div>
  <div id="finalOverlay" class="final-overlay" hidden aria-hidden="true">
    <div class="final-aura"></div>
    <img id="finalRelic" alt="" draggable="false">
    <div class="final-symbol" aria-hidden="true">ᛟ</div>
  </div>
</main>
</body>
</html>

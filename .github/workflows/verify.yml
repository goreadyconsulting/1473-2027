name: Verify portal
on:
  push:
    branches: [main, feat/larp-portal-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and gameplay tests
        run: |
          node --check app.js
          node --check sound.js
          node --check sw.js
          node --test tests/*.test.cjs
